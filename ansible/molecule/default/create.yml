---
# Fase 'create': Constrói as imagens multi-distro com suporte a systemd e inicializa os containers efêmeros
- name: Create ephemeral multi-distro containers with systemd
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Matriz de containers de teste construídos e provisionados em paralelo
    molecule_test_platforms:
      - name: fedora-test
        image: molecule-fedora-systemd
        tag: "44"
        dockerfile: Dockerfile
      - name: debian-test
        image: molecule-debian-systemd
        tag: "13"
        dockerfile: Dockerfile.debian

  tasks:
    # Constrói as imagens Docker localmente com base nos Dockerfiles do cenário de teste
    - name: Build test images with systemd installed
      community.docker.docker_image:
        name: "{{ item.image }}"
        tag: "{{ item.tag }}"
        source: build
        build:
          path: "{{ playbook_dir }}"
          dockerfile: "{{ item.dockerfile }}"
        state: present
      loop: "{{ molecule_test_platforms }}"

    # Inicia cada container com privilégios de kernel e montagens de cgroup necessárias para o systemd
    - name: Start test containers with systemd init
      community.docker.docker_container:
        name: "{{ item.name }}"
        image: "{{ item.image }}:{{ item.tag }}"
        state: started
        # Trade-off consciente para testes: privileged: true é necessário aqui porque o systemd precisa
        # gerenciar cgroups e o firewalld precisa manipular regras de rede do kernel (nftables).
        # Não usar este padrão em containers de aplicação em produção.
        privileged: true
        # Compartilha o namespace de cgroups do host para compatibilidade com cgroups v2
        cgroupns_mode: host
        # Monta diretórios voláteis em memória (tmpfs) requeridos pelo daemon do systemd
        tmpfs:
          - /run
          - /run/lock
        # Monta o sistema de arquivos de cgroups do host em modo leitura e escrita
        volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
        # Inicializa o processo systemd como PID 1
        command: /usr/sbin/init
        # Sinal RTMIN+3 instrui o systemd a efetuar desligamento gracioso (halt/poweroff)
        stop_signal: SIGRTMIN+3
        recreate: false
      loop: "{{ molecule_test_platforms }}"

    # Registra todas as instâncias no formato esperado pelo driver delegated do Molecule
    - name: Populate instance config
      ansible.builtin.set_fact:
        instance_conf: >-
          {{
            (instance_conf | default([])) + [{
              'instance': item.name,
              'address': item.name,
              'user': 'ansible',
              'port': 22,
              'connection': 'community.docker.docker'
            }]
          }}
      loop: "{{ molecule_test_platforms }}"

    # Grava o arquivo de estado de instâncias gerenciadas do Molecule (molecule_instance_config)
    - name: Dump instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed
          {{ instance_conf | to_yaml }}
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
