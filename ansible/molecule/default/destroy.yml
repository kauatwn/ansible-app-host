---
# Fase 'destroy': Para e remove os containers efêmeros garantindo recuperação total de recursos
- name: Destroy ephemeral multi-distro test containers
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # Para e remove os containers Docker utilizados no cenário de teste
    - name: Stop and remove test containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent # Remove o container se ele existir
        force_kill: true # Força parada imediata se necessário
      loop:
        - fedora-test
        - debian-test

    # Esvazia a lista de instâncias no Molecule para sinalizar a destruição
    - name: Populate instance config
      ansible.builtin.set_fact:
        instance_conf: []

    # Atualiza o arquivo molecule_instance_config com lista vazia
    - name: Dump instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed
          {{ instance_conf | to_yaml }}
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
