---
# Configuração do cenário de testes 'default' do Molecule adotando o padrão Ansible-native
# O Molecule utiliza playbooks Ansible para gerenciar todo o ciclo de vida do ambiente de teste

# Gerenciamento de dependências via Ansible Galaxy
dependency:
  name: galaxy
  options:
    # Reutiliza os manifestos oficiais de requisitos do projeto (coleções e roles)
    role-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

# Driver 'default' (delegated): o próprio Ansible executa o provisionamento e ciclo de vida
driver:
  name: default
  options:
    # managed: true delega ao Molecule o rastreamento das instâncias criadas via molecule_instance_config
    managed: true
    # Opções padrão de conexão para os hosts criados
    ansible_connection_options:
      ansible_connection: community.docker.docker

# Plataformas de teste: define as instâncias lógicas e seus grupos no inventário
platforms:
  - name: fedora-test # Nome da instância e container de teste
    groups:
      - web # Vincula ao grupo [web] definido no playbook de produção site.yml

# Provisionador Ansible: executa os playbooks correspondentes a cada fase do ciclo de vida
provisioner:
  name: ansible
  # Injeta as opções de conexão em nível de provisionador para acesso direto via Docker socket
  connection_options:
    ansible_connection: community.docker.docker
  playbooks:
    create: create.yml # Criação da imagem e inicialização do container Docker
    prepare: prepare.yml # Preparação de chaves SSH e espera pelo boot do systemd
    converge: converge.yml # Execução do playbook real de infraestrutura (site.yml)
    verify: verify.yml # Asserções de conformidade de serviços, hardening e HTTP
    cleanup: cleanup.yml # Limpeza de arquivos temporários e resíduos
    destroy: destroy.yml # Parada e remoção definitiva do container de teste
  config_options:
    defaults:
      # Caminho das roles do projeto para resolução correta durante a execução
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
      # Silencia avisos de descoberta do Python no container gerenciado
      interpreter_python: auto_silent
  inventory:
    host_vars:
      fedora-test:
        # Força o conector Docker como usuário não-privilegiado para validar become: true
        ansible_connection: community.docker.docker
        ansible_user: ansible
    group_vars:
      web:
        ansible_connection: community.docker.docker
        # Caminho absoluto para o binário Go compilado na máquina de controle
        app_binary_src: "${MOLECULE_PROJECT_DIRECTORY}/../bin/api"

# Verificador declarativo baseado em playbooks e asserções nativas do Ansible
verifier:
  name: ansible

# Sequência completa de execução do cenário de teste para garantir qualidade e idempotência
scenario:
  test_sequence:
    - dependency # 1. Instala coleções e dependências declaradas
    - cleanup # 2. Limpa resíduos de execuções anteriores
    - destroy # 3. Garante que containers antigos sejam encerrados
    - syntax # 4. Valida a sintaxe dos playbooks do cenário
    - create # 5. Cria a infraestrutura efêmera (container Fedora 44 com systemd)
    - prepare # 6. Aguarda o boot completo do init (systemd)
    - converge # 7. Aplica o playbook de produção (site.yml)
    - idempotence # 8. Executa novamente o playbook garantindo zero alterações adicionais
    - verify # 9. Audita serviços ativos, hardening SSH e proxy reverso HTTP
    - cleanup # 10. Limpa arquivos temporários
    - destroy # 11. Destrói o container efêmero liberando recursos
