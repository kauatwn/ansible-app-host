[defaults]
# Caminho padrão do inventário de hosts e do diretório contendo as roles reutilizáveis
inventory = inventory/hosts.ini
roles_path = roles

# Desativa a verificação interativa de chave SSH do host para execuções automatizadas sem prompts
host_key_checking = False

# Desativa a geração de arquivos .retry na raiz do projeto em caso de falha de execução
retry_files_enabled = False

# Suprime avisos sobre a descoberta automática do interpretador Python no host remoto
interpreter_python = auto_silent

# Desativa avisos de depreciação do Ansible durante execuções automatizadas
deprecation_warnings = False

[ssh_connection]
# Reutiliza a mesma conexão SSH para executar múltiplos módulos via stdin sem transferir arquivos via SFTP (acelera a execução remota)
pipelining = True
