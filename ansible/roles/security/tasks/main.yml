---
- name: Garantir pacotes de SSH, firewall e bindings Python do SELinux
  ansible.builtin.dnf:
    name:
      - openssh-server
      - firewalld
      - python3-firewall
      - policycoreutils-python-utils
    state: present

- name: Gerar chaves de host SSH caso ainda não existam
  ansible.builtin.command:
    cmd: ssh-keygen -A
    creates: /etc/ssh/ssh_host_ed25519_key

- name: Criar usuário administrativo no grupo wheel
  ansible.builtin.user:
    name: "{{ security_admin_user }}"
    groups: "{{ security_admin_group }}"
    append: true
    shell: /bin/bash
    create_home: true

- name: Configurar chave SSH autorizada para o usuário administrativo
  ansible.posix.authorized_key:
    user: "{{ security_admin_user }}"
    key: "{{ lookup('file', security_ssh_public_key_file) }}"
    state: present

- name: Configurar sudo sem senha para o usuário admin no laboratório
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ security_admin_user }}"
    content: "{{ security_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

- name: Aplicar hardening de SSH via drop-in de alta prioridade
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Reiniciar SSHD

- name: Garantir que os serviços sshd e firewalld estejam ativos no boot
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - sshd
    - firewalld

- name: Liberar serviços SSH e HTTP no firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ security_allowed_firewall_services }}"
