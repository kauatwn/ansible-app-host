---
# Carrega as variáveis específicas da família do sistema operacional (RedHat.yml ou Debian.yml)
- name: Load OS-family specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

# Atualiza o cache do APT em sistemas Debian/Ubuntu antes de usar o módulo genérico package
- name: Update APT package cache on Debian-based systems
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600 # Evita atualizações redundantes dentro de 1 hora (preserva idempotência)
  when: ansible_facts['os_family'] == 'Debian'

# Instala pacotes essenciais para comunicação segura, controle de firewall e suporte do SO
- name: Ensure SSH server, firewalld, and OS support packages are installed
  ansible.builtin.package:
    name: "{{ security_packages }}"
    state: present

# Em instalações minimalistas do Fedora/RHEL, o openssh-server pode não gerar chaves de host automaticamente
- name: Generate SSH host keys if missing
  ansible.builtin.command:
    cmd: ssh-keygen -A # Gera chaves ausentes de todos os tipos (RSA, ECDSA, ED25519)
    creates: /etc/ssh/ssh_host_ed25519_key # Evita execução desnecessária se a chave ED25519 já existir

# Cria um usuário administrativo nomeado para evitar o uso direto da conta 'root'
- name: Create administrative user in sudoers group
  ansible.builtin.user:
    name: "{{ security_admin_user }}"
    groups: "{{ security_admin_group }}" # Adiciona ao grupo sudoers da distribuição (wheel no Fedora, sudo no Debian)
    append: true # Garante a adição ao grupo sem remover o usuário de outros grupos existentes
    shell: /bin/bash # Shell interativo padrão para o administrador
    create_home: true # Cria o diretório /home para armazenamento de arquivos e chaves SSH

# Injeta a chave pública SSH do administrador local no servidor remoto
- name: Configure authorized SSH public key for administrative user
  ansible.posix.authorized_key:
    user: "{{ security_admin_user }}"
    key: "{{ lookup('file', security_ssh_public_key_file) }}" # Lê o arquivo de chave pública do nó de controle
    state: present

# Configura regras de sudo sem senha para o usuário administrativo no ambiente de laboratório
- name: Configure passwordless sudo for administrative user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ security_admin_user }}"
    content: "{{ security_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440" # Permissão estrita somente leitura requerida pelo sudoers
    validate: "visudo -cf %s" # Valida a sintaxe do arquivo temporário antes de salvar, evitando quebrar o sudo

# Hardening do SSH: Desativa login direto como root e autenticação por senha
# Usa arquivo drop-in no diretório sshd_config.d para não sobrescrever a configuração original da distribuição
- name: Apply SSH hardening drop-in configuration
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    content: |
      PermitRootLogin no # Força administradores a logarem com suas contas nominais
      PasswordAuthentication no # Bloqueia autenticação por senha, permitindo apenas chaves criptográficas
    validate: "/usr/sbin/sshd -t -f %s" # Testa a sintaxe do arquivo com o binário do sshd antes de aplicar
  notify: Restart ssh service # Reinicia o serviço SSH apenas se o arquivo foi criado ou modificado

# Garante que os serviços de acesso e firewall estejam ativos e configurados para iniciar no boot
- name: Ensure SSH and firewalld services are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true # Inicia o serviço automaticamente no boot do sistema operacional
    state: started # Garante que o serviço esteja em execução imediatamente
  loop:
    - "{{ security_ssh_service }}"
    - "{{ security_firewall_service }}"

# Configura a política do firewalld, bloqueando portas não explicitamente autorizadas
- name: Allow required services in firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true # Grava a regra na configuração persistente do firewall para resistir a reboots
    immediate: true # Aplica a regra imediatamente em tempo de execução sem exigir reload manual
    state: enabled
  loop: "{{ security_allowed_firewall_services }}"
