---
# Cria usuário de sistema dedicado e sem shell interativo para isolar o processo da aplicação
- name: Create unprivileged system user for the application
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true # Cria conta como usuário de sistema (UID baixo), sem expor como usuário comum
    shell: /usr/sbin/nologin # Desativa shell interativo para impedir login direto na máquina
    create_home: false # Não cria diretório /home para economizar recursos e evitar armazenamento desnecessário

# Cria o diretório de destino da aplicação com permissões adequadas
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}" # Garante propriedade do diretório para o usuário da aplicação
    group: "{{ app_user }}"
    mode: "0755" # Permite leitura e execução pelo proprietário e leitura por outros usuários

# Copia o binário Go compilado para o host remoto e define o contexto SELinux
- name: Copy compiled Go binary to application directory
  ansible.builtin.copy:
    src: "{{ app_binary_src }}" # Binário compilado na máquina de controle local
    dest: "{{ app_dir }}/{{ app_name }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755" # Permissão de execução necessária para o binário da aplicação
    # Define o contexto SELinux 'bin_t' apenas se o SELinux estiver ativo, autorizando a execução do binário
    setype: "{{ 'bin_t' if (ansible_facts.selinux.status | default('disabled')) == 'enabled' else omit }}"
  notify: Restart API service # Reinicia o serviço caso uma nova versão do binário seja copiada

# Renderiza a unit do systemd com políticas de segurança e isolamento (sandbox)
- name: Configure systemd service unit with security sandboxing
  ansible.builtin.template:
    src: api.service.j2 # Template Jinja2 contendo a configuração e diretivas de hardening
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0644" # Permissão padrão para units do systemd
  notify: Restart API service # Notifica o handler para reiniciar e recarregar o daemon se houver alteração

# Garante que o serviço da aplicação esteja habilitado para iniciar no boot e ativo no sistema
- name: Ensure API service is enabled and running
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    enabled: true # Inicia o serviço automaticamente durante o boot do servidor
    state: started # Garante que o processo esteja em execução no momento
    daemon_reload: true # Recarrega as definições de serviço do systemd a partir do disco
