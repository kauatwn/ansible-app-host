# Exemplo de inventário de hosts para provisionamento de infraestrutura
# Copie este arquivo para hosts.ini e preencha com os dados reais do seu servidor:
# cp ansible/inventory/host.example.ini ansible/inventory/hosts.ini
# Nota: 203.0.113.10 é um endereço IP fictício reservado para documentação (RFC 5737 / TEST-NET-3).

[web]
# Cenário 1: Primeiro provisionamento (Bootstrap)
# Conecta utilizando o usuário padrão da imagem de nuvem/SO (ex: fedora, ec2-user ou ubuntu)
# app-server ansible_host=203.0.113.10 ansible_user=fedora ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Cenário 2: Execuções seguintes e manutenção contínua
# Conecta com o usuário administrativo dedicado criado e endurecido pela role 'security'
app-server ansible_host=203.0.113.10 ansible_user=sysadmin ansible_ssh_private_key_file=~/.ssh/id_ed25519
