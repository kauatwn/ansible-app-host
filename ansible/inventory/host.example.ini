# Copie este arquivo para hosts.ini e preencha com os dados reais do seu servidor:
# cp ansible/inventory/hosts.example.ini ansible/inventory/hosts.ini
# Nota: 203.0.113.10 é um IP fictício reservado para documentação (RFC 5737 / TEST-NET-3).

[web]
# Primeiro provisionamento (use o usuário padrão da imagem da nuvem, ex: fedora ou ec2-user):
# app-server ansible_host=203.0.113.10 ansible_user=fedora ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Execuções seguintes (após a role security criar o usuário endurecido):
app-server ansible_host=203.0.113.10 ansible_user=sysadmin ansible_ssh_private_key_file=~/.ssh/id_ed25519